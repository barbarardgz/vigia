<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="Módulo acelerómetro y giróscopo de 3 ejes MPU-6050, 6 grados de libertad">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fae"/>
      <stop offset="1" stop-color="#115080"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4652"/>
      <stop offset="1" stop-color="#141a20"/>
    </linearGradient>
  </defs>

  <!-- PCB -->
  <rect x="40" y="30" width="180" height="140" rx="8" fill="url(#pcb)"/>
  <rect x="43" y="33" width="174" height="134" rx="6" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>

  <!-- Pistas -->
  <g stroke="#a8d4f2" stroke-width="1.6" fill="none" opacity=".85" stroke-linecap="round">
    <path d="M130 96 L130 150"/>
    <path d="M118 96 L118 150"/>
    <path d="M170 70 L200 70"/>
    <path d="M90 120 L58 120"/>
    <path d="M170 120 L200 120"/>
  </g>

  <!-- Pines del encabezado (8, lado izquierdo) -->
  <g>
    <rect x="52" y="48" width="10" height="5" rx="1.2" fill="#e8c86a"/>
    <rect x="52" y="60" width="10" height="5" rx="1.2" fill="#e8c86a"/>
    <rect x="52" y="72" width="10" height="5" rx="1.2" fill="#e8c86a"/>
    <rect x="52" y="84" width="10" height="5" rx="1.2" fill="#e8c86a"/>
    <rect x="52" y="96" width="10" height="5" rx="1.2" fill="#e8c86a"/>
    <rect x="52" y="108" width="10" height="5" rx="1.2" fill="#e8c86a"/>
    <rect x="52" y="120" width="10" height="5" rx="1.2" fill="#e8c86a"/>
    <rect x="52" y="132" width="10" height="5" rx="1.2" fill="#e8c86a"/>
  </g>

  <!-- Chip principal MPU-6050 -->
  <rect x="86" y="62" width="96" height="68" rx="3" fill="url(#chip)"/>
  <g stroke="#6d8294" stroke-width="1.2">
    <line x1="92" y1="58" x2="92" y2="62"/><line x1="104" y1="58" x2="104" y2="62"/><line x1="116" y1="58" x2="116" y2="62"/>
    <line x1="128" y1="58" x2="128" y2="62"/><line x1="140" y1="58" x2="140" y2="62"/><line x1="152" y1="58" x2="152" y2="62"/><line x1="164" y1="58" x2="164" y2="62"/><line x1="176" y1="58" x2="176" y2="62"/>
    <line x1="92" y1="130" x2="92" y2="134"/><line x1="104" y1="130" x2="104" y2="134"/><line x1="116" y1="130" x2="116" y2="134"/>
    <line x1="128" y1="130" x2="128" y2="134"/><line x1="140" y1="130" x2="140" y2="134"/><line x1="152" y1="130" x2="152" y2="134"/><line x1="164" y1="130" x2="164" y2="134"/><line x1="176" y1="130" x2="176" y2="134"/>
    <line x1="82" y1="70" x2="86" y2="70"/><line x1="82" y1="80" x2="86" y2="80"/><line x1="82" y1="90" x2="86" y2="90"/><line x1="82" y1="100" x2="86" y2="100"/><line x1="82" y1="110" x2="86" y2="110"/><line x1="82" y1="120" x2="86" y2="120"/>
    <line x1="182" y1="70" x2="186" y2="70"/><line x1="182" y1="80" x2="186" y2="80"/><line x1="182" y1="90" x2="186" y2="90"/><line x1="182" y1="100" x2="186" y2="100"/><line x1="182" y1="110" x2="186" y2="110"/><line x1="182" y1="120" x2="186" y2="120"/>
  </g>
  <circle cx="176" cy="66" r="2" fill="#e0553f"/>
  <text x="134" y="92" fill="#fff" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">MPU</text>
  <text x="134" y="104" fill="#a8d4f2" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">-6050</text>
  <text x="134" y="116" fill="rgba(255,255,255,.5)" font-family="sans-serif" font-size="6" text-anchor="middle">ACCEL · GYRO</text>

  <!-- Regulador y componentes pasivos -->
  <rect x="200" y="146" width="12" height="8" rx="1" fill="#3a4652"/>
  <rect x="200" y="132" width="12" height="8" rx="1" fill="#3a4652"/>
  <circle cx="210" cy="120" r="4" fill="#31475a" stroke="rgba(255,255,255,.3)" stroke-width="1"/>
  <circle cx="214" cy="46" r="3.5" fill="#31475a"/>
  <circle cx="224" cy="46" r="3.5" fill="#31475a"/>
  <text x="194" y="156" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7">LDO</text>

  <!-- Ejes de coordenadas (3 DOF) -->
  <g transform="translate(30,44)">
    <g stroke="#f2c94c" stroke-width="2" stroke-linecap="round" fill="none">
      <line x1="0" y1="0" x2="26" y2="0"/><polygon points="26,0 18,-4 18,4" fill="#f2c94c"/>
      <line x1="0" y1="0" x2="0" y2="-22"/><polygon points="0,-22 -4,-14 4,-14" fill="#f2c94c"/>
      <line x1="0" y1="0" x2="-18" y2="-18"/><polygon points="-18,-18 -11,-20 -15,-13" fill="#f2c94c"/>
    </g>
    <text x="30" y="4" fill="#f2c94c" font-family="sans-serif" font-size="9" font-weight="700">X</text>
    <text x="-4" y="-24" fill="#f2c94c" font-family="sans-serif" font-size="9" font-weight="700">Y</text>
    <text x="-26" y="-24" fill="#f2c94c" font-family="sans-serif" font-size="9" font-weight="700">Z</text>
  </g>

  <!-- Etiqueta I2C -->
  <text x="130" y="158" fill="rgba(255,255,255,.75)" font-family="sans-serif" font-size="8.5" letter-spacing="1.2" text-anchor="middle">I²C · SCL / SDA</text>
  <text x="130" y="170" fill="rgba(255,255,255,.5)" font-family="sans-serif" font-size="7" letter-spacing="1.2" text-anchor="middle">6 GRADOS DE LIBERTAD</text>
</svg>