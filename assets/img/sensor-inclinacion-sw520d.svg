<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="Módulo sensor de inclinación y caída SW-520D (Tecneu)">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fae"/>
      <stop offset="1" stop-color="#115080"/>
    </linearGradient>
    <linearGradient id="capi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8dc85"/>
      <stop offset="1" stop-color="#c99b2e"/>
    </linearGradient>
    <radialGradient id="ledv" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#aef27a"/>
      <stop offset="1" stop-color="#379e2a"/>
    </radialGradient>
  </defs>

  <!-- PCB -->
  <rect x="35" y="30" width="190" height="140" rx="8" fill="url(#pcb)"/>
  <rect x="38" y="33" width="184" height="134" rx="6" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>

  <!-- Pistas -->
  <g stroke="#a8d4f2" stroke-width="2" fill="none" opacity=".85" stroke-linecap="round">
    <path d="M102 92 L102 122 L88 122"/>
    <path d="M168 92 L168 122 L182 122"/>
    <path d="M102 122 L102 145"/>
    <path d="M168 122 L168 112"/>
    <path d="M190 112 L205 112"/>
  </g>

  <!-- Cápsula del interruptor de inclinación (SW-520D) -->
  <rect x="92" y="38" width="86" height="34" rx="17" fill="rgba(255,214,102,.18)" stroke="#f2c94c" stroke-width="2.2"/>
  <!-- Esfera metálica interna, rodando hacia el extremo inclinado -->
  <circle cx="160" cy="58" r="8" fill="#3f3f3f"/>
  <circle cx="158" cy="56" r="2.8" fill="#9a9a9a"/>
  <path d="M164 52 A10 10 0 0 1 168 58" fill="none" stroke="#7a7a7a" stroke-width="1.4"/>
  <!-- Terminales -->
  <rect x="96" y="52" width="8" height="18" rx="2" fill="#d8b862"/>
  <rect x="166" y="52" width="8" height="18" rx="2" fill="#d8b862"/>
  <line x1="100" y1="72" x2="100" y2="92" stroke="#d8b862" stroke-width="3"/>
  <line x1="170" y1="72" x2="170" y2="92" stroke="#d8b862" stroke-width="3"/>
  <circle cx="100" cy="92" r="4.5" fill="#0a2c47"/>
  <circle cx="170" cy="92" r="4.5" fill="#0a2c47"/>

  <!-- Flecha de inclinación -->
  <g stroke="#f2c94c" stroke-width="2.4" fill="none" stroke-linecap="round">
    <path d="M116 106 C 116 78, 136 72, 150 74"/>
    <path d="M143 66 L152 70 L149 78"/>
  </g>
  <text x="120" y="100" fill="#f2c94c" font-family="sans-serif" font-size="10" text-anchor="middle">caída</text>

  <!-- Potenciómetro de ajuste -->
  <rect x="196" y="88" width="18" height="18" rx="2" fill="#2f6ea0" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>
  <circle cx="205" cy="97" r="5" fill="#0f3a5c"/>
  <line x1="201" y1="97" x2="209" y2="97" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>
  <text x="205" y="84" fill="rgba(255,255,255,.75)" font-family="sans-serif" font-size="8" text-anchor="middle">ajuste</text>

  <!-- LED -->
  <circle cx="55" cy="138" r="6" fill="url(#ledv)"/>
  <circle cx="55" cy="138" r="9" fill="rgba(58,158,42,.28)"/>
  <text x="55" y="152" fill="rgba(255,255,255,.7)" font-family="sans-serif" font-size="8" text-anchor="middle">LED</text>

  <!-- Pines -->
  <g>
    <rect x="52" y="148" width="12" height="6" rx="1.5" fill="#e8c86a"/>
    <rect x="76" y="148" width="12" height="6" rx="1.5" fill="#e8c86a"/>
    <rect x="100" y="148" width="12" height="6" rx="1.5" fill="#e8c86a"/>
    <rect x="124" y="148" width="12" height="6" rx="1.5" fill="#e8c86a"/>
    <text x="58" y="163" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7" text-anchor="middle">VCC</text>
    <text x="82" y="163" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7" text-anchor="middle">GND</text>
    <text x="106" y="163" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7" text-anchor="middle">DO</text>
    <text x="130" y="163" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7" text-anchor="middle">AO</text>
  </g>

  <!-- Serigrafía -->
  <text x="120" y="128" fill="rgba(255,255,255,.92)" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SW-520D</text>
  <text x="120" y="140" fill="rgba(255,255,255,.55)" font-family="sans-serif" font-size="7.5" text-anchor="middle" letter-spacing="1.5">SENSOR DE INCLINACIÓN</text>
</svg>