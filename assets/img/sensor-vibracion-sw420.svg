<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="Módulo sensor de vibración súbita SW-420 NC">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d6fae"/>
      <stop offset="1" stop-color="#115080"/>
    </linearGradient>
    <radialGradient id="ledr" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ff9666"/>
      <stop offset="1" stop-color="#c8431f"/>
    </radialGradient>
  </defs>

  <!-- PCB -->
  <rect x="35" y="30" width="190" height="140" rx="8" fill="url(#pcb)"/>
  <rect x="38" y="33" width="184" height="134" rx="6" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="1"/>

  <!-- Pistas -->
  <g stroke="#a8d4f2" stroke-width="2" fill="none" opacity=".85" stroke-linecap="round">
    <path d="M120 118 L120 140"/>
    <path d="M120 140 L108 140"/>
    <path d="M96 140 L84 140"/>
    <path d="M120 118 L152 118"/>
    <path d="M152 118 L152 92"/>
  </g>

  <!-- Cartela fija del resorte -->
  <rect x="108" y="66" width="24" height="14" rx="3" fill="#d8b862"/>
  <circle cx="120" cy="66" r="5" fill="#0a2c47"/>

  <!-- Resorte de detección (lámina que tiembla con la vibración) -->
  <path d="M120 60 C 116 54,124 50,120 44 C 116 38,124 34,120 28 C 116 22,124 18,120 12"
        fill="none" stroke="#e8c86a" stroke-width="3" stroke-linecap="round"/>
  <g stroke="rgba(255,232,138,.5)" stroke-width="1.5" fill="none">
    <path d="M117 60 C 113 54,121 50,117 44 C 113 38,121 34,117 28"/>
    <path d="M123 60 C 119 54,127 50,123 44 C 119 38,127 34,123 28"/>
  </g>
  <circle cx="120" cy="11" r="5" fill="#e8c86a" stroke="#8a6d1f" stroke-width="1.4"/>

  <!-- Ondas de vibración -->
  <g stroke="#f2c94c" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M60 78 q 6 -8 12 0 q 6 8 12 0"/>
    <path d="M74 66 q 6 -8 12 0 q 6 8 12 0"/>
  </g>
  <text x="86" y="104" fill="#f2c94c" font-family="sans-serif" font-size="10" text-anchor="middle">vibración</text>

  <!-- Potenciómetro de ajuste de sensibilidad -->
  <rect x="176" y="96" width="18" height="18" rx="2" fill="#2f6ea0" stroke="rgba(255,255,255,.35)" stroke-width="1.2"/>
  <circle cx="185" cy="105" r="5" fill="#0f3a5c"/>
  <line x1="181" y1="105" x2="189" y2="105" stroke="rgba(255,255,255,.6)" stroke-width="1.5"/>
  <text x="185" y="92" fill="rgba(255,255,255,.75)" font-family="sans-serif" font-size="8" text-anchor="middle">ajuste</text>

  <!-- LED -->
  <circle cx="226" cy="38" r="6" fill="url(#ledr)"/>
  <circle cx="226" cy="38" r="9" fill="rgba(200,67,31,.25)"/>
  <text x="226" y="52" fill="rgba(255,255,255,.7)" font-family="sans-serif" font-size="8" text-anchor="middle">LED</text>

  <!-- Pines -->
  <g>
    <rect x="52" y="148" width="12" height="6" rx="1.5" fill="#e8c86a"/>
    <rect x="76" y="148" width="12" height="6" rx="1.5" fill="#e8c86a"/>
    <rect x="100" y="148" width="12" height="6" rx="1.5" fill="#e8c86a"/>
    <rect x="124" y="148" width="12" height="6" rx="1.5" fill="#e8c86a"/>
    <text x="58" y="163" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7" text-anchor="middle">VCC</text>
    <text x="82" y="163" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7" text-anchor="middle">GND</text>
    <text x="106" y="163" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7" text-anchor="middle">DO</text>
    <text x="130" y="163" fill="rgba(255,255,255,.6)" font-family="sans-serif" font-size="7" text-anchor="middle">AO</text>
  </g>

  <!-- Serigrafía -->
  <text x="120" y="128" fill="rgba(255,255,255,.92)" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SW-420</text>
  <text x="120" y="140" fill="rgba(255,255,255,.55)" font-family="sans-serif" font-size="7.5" text-anchor="middle" letter-spacing="1.5">SENSOR DE VIBRACIÓN · NC</text>
</svg>