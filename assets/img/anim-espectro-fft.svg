<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="Animación: la FFT calcula la frecuencia natural y esta baja al perderse rigidez, comparada contra la línea base de la estructura sana">
  <defs>
    <linearGradient id="pk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9cc2ea"/>
      <stop offset="1" stop-color="#5b93d4"/>
    </linearGradient>
  </defs>

  <!-- Estructura que vibra -->
  <g stroke="#9cc2ea" stroke-width="5" stroke-linecap="round" fill="none">
    <path>
      <animate attributeName="d" values="M50 30 Q 130 24 210 30;M50 30 Q 130 44 210 30;M50 30 Q 130 24 210 30"
               keyTimes="0;.5;1" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>
  <g fill="#3a6fb0" stroke="#9cc2ea" stroke-width="1.4">
    <path d="M60 30 L60 48 L74 30 Z"/>
    <path d="M186 30 L200 30 L200 48 Z"/>
  </g>

  <!-- Δf que aparece cuando cambia el pico -->
  <text x="130" y="20" fill="#e0a530" font-family="sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">
    Δf ≈ −20 %: perdió rigidez
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.5;.8;1" dur="6s" repeatCount="indefinite"/>
  </text>

  <!-- Caja FFT -->
  <rect x="82" y="56" width="96" height="24" rx="6" fill="rgba(40,82,140,.55)" stroke="rgba(90,147,212,.6)" stroke-width="1.2"/>
  <text x="130" y="72" fill="#d8e6f5" font-family="sans-serif" font-size="8.5" text-anchor="middle" letter-spacing=".5">FFT · Hanning · 1024</text>
  <path d="M130 80 L130 108" stroke="rgba(255,255,255,.4)" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- Eje de frecuencias -->
  <line x1="32" y1="160" x2="248" y2="160" stroke="rgba(255,255,255,.35)" stroke-width="1.4"/>
  <text x="130" y="182" fill="#b9c8da" font-family="sans-serif" font-size="9" text-anchor="middle">frecuencia</text>

  <!-- Línea base (pico sano, fantasmal) -->
  <path d="M155 160 C 161 140 177 122 185 122 C 193 122 209 140 215 160 Z"
        fill="none" stroke="#9cc2ea" stroke-width="1.6" stroke-dasharray="4 4" opacity=".55"/>
  <text x="185" y="176" fill="#9cc2ea" font-family="sans-serif" font-size="8.5" text-anchor="middle">f₀ línea base</text>

  <!-- Pico medido: se corre a la izquierda al bajar la rigidez -->
  <path fill="url(#pk)" opacity=".92" stroke="#9cc2ea" stroke-width="1.2">
    <animate attributeName="d"
             values="M155 160 C 161 140 177 122 185 122 C 193 122 209 140 215 160 Z;M155 160 C 161 140 177 122 185 122 C 193 122 209 140 215 160 Z;M85 160 C 91 140 107 122 115 122 C 123 122 139 140 145 160 Z;M85 160 C 91 140 107 122 115 122 C 123 122 139 140 145 160 Z;M155 160 C 161 140 177 122 185 122 C 193 122 209 140 215 160 Z"
             keyTimes="0;.3;.5;.8;1" dur="6s" repeatCount="indefinite"/>
  </path>
  <text x="115" y="176" fill="#d8e6f5" font-family="sans-serif" font-size="8.5" font-weight="700" text-anchor="middle">
    f₁ dañada
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.5;.8;1" dur="6s" repeatCount="indefinite"/>
  </text>
</svg>